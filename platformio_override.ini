[platformio]
default_envs = esp32s3dev_seengreat_hub75

[env:esp32s3dev_seengreat_hub75]
board = esp32-s3-devkitc-1
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags_esp32s3}
  -D WLED_RELEASE_NAME=ESP32S3_SeenGreat_HUB75
  -D WLEDENABLEHUB75MATRIX
  -D SEENGREAT_ESP32S3_PINOUT
lib_deps = ${esp32s3.lib_deps}
board_build.partitions = ${esp32s3.default_partitions_16MB}
