[platformio]
default_envs = esp32s3dev_16MB_PSRAM_M_HUB75_seengreat

[env:esp32s3dev_16MB_PSRAM_M_HUB75_seengreat]
board = esp32-s3-devkitc-1
platform = ${esp32s3.platform}
platform_packages = ${esp32s3.platform_packages}
build_unflags = ${common.build_unflags}
build_flags = ${common.build_flags_esp32s3} 
  -D WLED_RELEASE_NAME=ESP32S3_HUB75_SeenGreat
  -D HUB75_R1=37
  -D HUB75_G1=6
  -D HUB75_B1=36
  -D HUB75_R2=35
  -D HUB75_G2=5
  -D HUB75_B2=0
  -D HUB75_A=45
  -D HUB75_B=1
  -D HUB75_C=48
  -D HUB75_D=2
  -D HUB75_E=4
  -D HUB75_CLK=47
  -D HUB75_LAT=38
  -D HUB75_OE=21
lib_deps = ${esp32s3.lib_deps}
board_build.partitions = ${esp32s3.default_partitions}
